services:
  vpn:
    build:
      context: ..
      dockerfile: nas-runner/vpn/Dockerfile
    container_name: anav-map-packs-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${VPN_CONFIG_DIR}/ipsec.conf:/etc/ipsec.conf:ro
      - ${VPN_CONFIG_DIR}/ipsec.secrets:/etc/ipsec.secrets:ro
      - ${VPN_CONFIG_DIR}/comodo.crt:/etc/ipsec.d/cacerts/comodo.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "ipsec statusall | grep -q 'ESTABLISHED.*adguard'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    pids_limit: 256

  runner:
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
