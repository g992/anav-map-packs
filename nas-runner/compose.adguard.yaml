services:
  vpn:
    build:
      context: ..
      dockerfile: nas-runner/vpn-adguard/Dockerfile
    container_name: anav-map-packs-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    environment:
      ADGUARD_VPN_LOCATION: ${ADGUARD_VPN_LOCATION:-Netherlands}
      ADGUARD_VPN_PROTOCOL: ${ADGUARD_VPN_PROTOCOL:-http2}
    volumes:
      - ${ADGUARD_VPN_STATE_DIR}:/root/.local/share/adguardvpn-cli
    healthcheck:
      test: ["CMD-SHELL", "ip -4 route get 1.1.1.1 | grep -Eq 'dev tun0([[:space:]]|$)' && curl -4 -fsS --max-time 10 https://api.ipify.org >/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  runner:
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
