name: Validate pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
      - name: Build isolated IKEv2 image
        run: docker build --file nas-runner/vpn/Dockerfile --tag anav-map-packs-vpn:ci .
      - name: Build isolated AdGuard VPN CLI image
        run: docker build --file nas-runner/vpn-adguard/Dockerfile --tag anav-map-packs-adguard-vpn:ci .
