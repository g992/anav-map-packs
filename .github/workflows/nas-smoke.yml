name: NAS runner smoke test

on:
  workflow_dispatch:
    inputs:
      region_id:
        description: Catalog region ID used for the live extraction
        required: true
        default: ru-mos

permissions:
  contents: read

jobs:
  discover-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_url: ${{ steps.source.outputs.source_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact regional boundaries
        run: python3 scripts/prepare_catalog.py
      - name: Discover current OpenFreeMap source
        id: source
        run: python3 scripts/discover_openfreemap.py --github-output "$GITHUB_OUTPUT"
      - name: Share boundary catalog
        uses: actions/upload-artifact@v4
        with:
          name: nas-smoke-catalog-${{ github.run_id }}
          path: build
          retention-days: 1
          if-no-files-found: error

  verify-runner:
    needs: discover-source
    runs-on: [self-hosted, Linux, X64, ofm-builder]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nas-smoke-catalog-${{ github.run_id }}
          path: build
      - name: Verify isolated data volume and tools
        run: |
          id
          python3 --version
          df -h /data
          test -w /data
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Install verified PMTiles CLI
        run: ./scripts/install_pmtiles_linux.sh "$RUNNER_TEMP/pmtiles-bin"
      - name: Probe OpenFreeMap range throughput
        env:
          SOURCE_URL: ${{ needs.discover-source.outputs.source_url }}
        run: |
          set -euo pipefail
          printf 'VPN egress IP: '
          curl --fail --silent --show-error --max-time 20 https://api.ipify.org
          printf '\n'
          probe="$RUNNER_TEMP/openfreemap-range.bin"
          start=$(date +%s)
          curl --fail --location --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            --header 'Range: bytes=0-1048575' \
            --output "$probe" \
            "$SOURCE_URL"
          elapsed=$(( $(date +%s) - start ))
          bytes=$(wc -c < "$probe")
          printf 'OpenFreeMap direct probe: bytes=%s elapsed_seconds=%s\n' "$bytes" "$elapsed"
          test "$bytes" -eq 1048576
          rm -f "$probe"
      - name: Extract exact region directly through VPN
        env:
          SOURCE_URL: ${{ needs.discover-source.outputs.source_url }}
          REGION_ID: ${{ inputs.region_id }}
        run: |
          set -euo pipefail
          python3 scripts/build_shard.py \
            --source "$SOURCE_URL" \
            --pmtiles "$RUNNER_TEMP/pmtiles-bin/pmtiles" \
            --region-id "$REGION_ID" \
            --output-dir "$RUNNER_TEMP/region" \
            --download-threads 4 \
            --extract-timeout-seconds 9000
          ls -lh "$RUNNER_TEMP/region/$REGION_ID.pmtiles"
