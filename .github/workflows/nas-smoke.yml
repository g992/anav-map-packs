name: NAS runner smoke test

on:
  workflow_dispatch:
    inputs:
      region_id:
        description: Catalog region ID used for the live extraction
        required: true
        default: ru-mos

permissions:
  contents: read

jobs:
  discover-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_url: ${{ steps.source.outputs.source_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact regional boundaries
        run: python3 scripts/prepare_catalog.py
      - name: Discover current OpenFreeMap source
        id: source
        run: python3 scripts/discover_openfreemap.py --github-output "$GITHUB_OUTPUT"
      - name: Share boundary catalog
        uses: actions/upload-artifact@v4
        with:
          name: nas-smoke-catalog-${{ github.run_id }}
          path: build
          retention-days: 1
          if-no-files-found: error

  verify-runner:
    needs: discover-source
    runs-on: [self-hosted, Linux, X64, ofm-builder]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nas-smoke-catalog-${{ github.run_id }}
          path: build
      - name: Verify isolated data volume and tools
        run: |
          id
          python3 --version
          df -h /data
          test -w /data
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Install verified PMTiles CLI
        run: ./scripts/install_pmtiles_linux.sh "$RUNNER_TEMP/pmtiles-bin"
      - name: Probe OpenFreeMap range throughput
        env:
          SOURCE_URL: ${{ needs.discover-source.outputs.source_url }}
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/openfreemap-range.bin"
          start=$(date +%s)
          set +e
          curl --fail --location --show-error \
            --connect-timeout 15 \
            --max-time 15 \
            --header 'Range: bytes=0-1048575' \
            --output "$probe" \
            "$SOURCE_URL"
          status=$?
          set -e
          elapsed=$(( $(date +%s) - start ))
          bytes=$(wc -c < "$probe" 2>/dev/null || printf 0)
          printf 'OpenFreeMap direct probe: bytes=%s elapsed_seconds=%s curl_status=%s\n' "$bytes" "$elapsed" "$status"
          rm -f "$probe"
      - name: Extract exact region through split-range proxy
        env:
          SOURCE_URL: ${{ needs.discover-source.outputs.source_url }}
          REGION_ID: ${{ inputs.region_id }}
        run: |
          set -euo pipefail
          proxy_log="$RUNNER_TEMP/range-proxy.log"
          python3 scripts/range_proxy.py --source "$SOURCE_URL" > "$proxy_log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true; wait "$proxy_pid" 2>/dev/null || true; cat "$proxy_log"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent --head http://127.0.0.1:8765/source.pmtiles && break
            sleep 1
          done
          curl --fail --silent --head http://127.0.0.1:8765/source.pmtiles
          python3 scripts/build_shard.py \
            --source http://127.0.0.1:8765/source.pmtiles \
            --pmtiles "$RUNNER_TEMP/pmtiles-bin/pmtiles" \
            --region-id "$REGION_ID" \
            --output-dir "$RUNNER_TEMP/region" \
            --download-threads 4 \
            --extract-timeout-seconds 9000
          ls -lh "$RUNNER_TEMP/region/$REGION_ID.pmtiles"
